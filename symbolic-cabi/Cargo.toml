[package]
name = "symbolic-cabi"
version = "12.17.9-dd"
license = "MIT"
authors = [
    "Armin Ronacher <armin.ronacher@active-4.com>",
    "Jan Michael Auer <mail@jauer.org>",
]
homepage = "https://github.com/getsentry/symbolic"
repository = "https://github.com/getsentry/symbolic"
description = """
C interface wrapper for symbolic, a library to symbolicate and process stack
traces from native applications, minidumps, minified JavaScript or ProGuard
optimized Android apps.
"""
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"] # lib is required for us to build symbolic

[dependencies]
anyhow = "1.0.32"
async-trait = { workspace = true }
futures-executor = { workspace = true }
minidump = { workspace = true }
minidump-processor = { workspace = true }
minidump-unwind = { workspace = true }
proguard = { workspace = true, features = ["uuid"] }
serde = { workspace = true }
serde_json = { workspace = true }
sourcemap = { workspace = true }
symbolic = { version = "12.17.9-dd", path = "../symbolic", features = [
    "cfi",
    "debuginfo",
    "demangle",
    "il2cpp",
    "ppdb",
    "sourcemapcache",
    "symcache",
] }
tempfile = { workspace = true }
